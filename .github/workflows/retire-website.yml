name: Retire CET-6 learning website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-website.yml'
      - 'retirement/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cet6-pages
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: retirement
      - id: deployment
        uses: actions/deploy-pages@v4
