name: Publish CET-6 study app

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cet6-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/cache@v6
        with:
          path: public-state
          key: cet6-public-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cet6-public-state-
      - run: npm run check
      - run: node publish-static.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
